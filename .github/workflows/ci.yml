name: Build on Windows

permissions:
  contents: write

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Install Sanny Builder
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            -Uri 'https://api.github.com/repos/sannybuilder/dev/releases/tags/v4.2.0'
          $asset = $release.assets | Where-Object name -eq 'SannyBuilder-v4.2.0.zip' | Select-Object -First 1
          if (-not $asset) {
            throw 'The pinned Sanny Builder 4.2.0 archive was not found.'
          }

          $archive = Join-Path $env:RUNNER_TEMP 'SannyBuilder-v4.2.0.zip'
          $installDirectory = Join-Path $env:RUNNER_TEMP 'SannyBuilder-v4.2.0'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $installDirectory
          "SANNY_BUILDER_PATH=$installDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile main SCM
        shell: pwsh
        run: ./scripts/validate-scm.ps1

      - name: Validate mission co-op protocol
        shell: pwsh
        run: |
          python -m unittest discover -s tests/mission_session -p 'test_*.py'
          ./scripts/audit-story-missions.ps1 -RequireReady -SummaryOnly

      - name: Build client
        run: xmake build client

      - name: Build server
        run: xmake build server
        
      - name: Build proxy
        run: xmake build proxy
        
      - name: Build launcher
        run: xmake build launcher

      - name: Build one-click playtest updater
        run: xmake build playtest_launcher

      - name: Stage playtest release
        shell: pwsh
        run: ./scripts/stage-playtest.ps1

      - name: Upload playtest artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoopAndreas-playtest-${{ github.sha }}
          path: build/playtest/release-assets

      - name: Publish rolling playtest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'itsLighty/CoopAndreas'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view playtest-latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete playtest-latest --cleanup-tag --yes
          }
          $assets = Get-ChildItem -LiteralPath 'build/playtest/release-assets' -File |
            ForEach-Object FullName
          gh release create playtest-latest @assets `
            --target '${{ github.sha }}' `
            --prerelease `
            --title 'Latest CoopAndreas Playtest' `
            --notes "Automated one-click playtest build from commit ${{ github.sha }}."
